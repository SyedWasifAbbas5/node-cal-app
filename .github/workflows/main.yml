name: Node.js CI with Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Build Docker image
      run: docker build -t express-calculator .

    - name: Test Docker image
      run: docker run -d -p 3000:3000 --name express-calculator express-calculator && sleep 3 && curl -sSf http://localhost:3000 && docker stop express-calculator
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    
    - name: Tag Docker image
      run: |
        docker tag express-calculator ${{ secrets.DOCKER_USERNAME }}/express-calculator:latest

    - name: Push Docker image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/express-calculator:latest

    - name: Deploy to Kubernetes
      uses: azure/k8s-deploy@v1
      with:
        kubeconfig: ${{ secrets.KUBECONFIG }}
        manifests: |
          kubernetes/deployment.yaml
          kubernetes/service.yaml
