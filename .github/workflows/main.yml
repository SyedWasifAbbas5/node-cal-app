name: Node.js CI with Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Build Docker image
      run: docker build -t express-calculator .

    - name: Test Docker image
      run: docker run -d -p 3000:3000 --name express-calculator express-calculator && sleep 3 && curl -sSf http://localhost:3000 && docker stop express-calculator
